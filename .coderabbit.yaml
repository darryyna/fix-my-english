# CodeRabbit repository configuration.
# Docs: https://docs.coderabbit.ai/getting-started/yaml-configuration
# Must live at the repo root and be committed to the default branch (develop/main).

language: "uk-UA"

tone_instructions: >
  Пиши стисло та по суті, українською. Пояснюй "чому", а не тільки "що".
  Це соло pet-проєкт (Expo Router + TypeScript + Supabase), тож не вимагай
  enterprise-практик (немоно-repo, немає потреби в CODEOWNERS для кожного PR тощо).

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.lock"
    - "!package-lock.json"
    - "!**/*.svg"
    - "!assets/**"
    - "!.expo/**"
  path_instructions:
    - path: "app/**/*.tsx"
      instructions: >
        Це екрани Expo Router (React Native + TypeScript). Перевіряй: коректне
        використання хуків, відсутність inline-функцій, що ламають memoization
        у великих списках, доступність (accessibilityLabel на інтерактивних
        елементах), та відповідність кольорів/відступів токенам з
        constants/theme.ts замість хардкоду hex-кольорів.
    - path: "store/**/*.ts"
      instructions: >
        Це zustand-стори. Перевіряй відсутність зайвих ре-рендерів (селектори
        мають бути вузькими), коректну обробку помилок Supabase (error завжди
        повертається, а не кидається як exception без обробки), і що side-effects
        (auth listeners) правильно ансабскрайбляться.
    - path: "supabase/migrations/**/*.sql"
      instructions: >
        Перевіряй SQL-міграції: Row Level Security обов'язково увімкнена на
        нових таблицях з призначеними policy, foreign keys мають ON DELETE
        поведінку, і що міграція idempotent (create if not exists / drop
        if exists перед create).
    - path: "lib/supabase.ts"
      instructions: >
        Ключі й URL Supabase мають братись лише з process.env.EXPO_PUBLIC_*,
        ніколи не хардкодити секрети в коді.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
